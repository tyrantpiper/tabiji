name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  meltdown-defense:
    name: Agent Meltdown Defense
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check for BLOCKED.md
      run: |
        if [ -f "BLOCKED.md" ]; then
          echo "::error::BLOCKED.md found! Agent Meltdown triggered. Fix the issue and remove the file before merging."
          exit 1
        fi

  quality-check:
    name: Frontend Quality Checks (@qa)
    needs: meltdown-defense
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Type Check (tsc)
      run: npx tsc --noEmit
      
    - name: Lint (ESLint)
      run: npm run lint
      
    - name: Unit Tests (Vitest)
      run: npm run test -- --run

  backend-quality:
    name: Backend Quality Checks (@qa)
    needs: meltdown-defense
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: pip install -r requirements.txt
      
    - name: Run Pytest
      run: pytest
